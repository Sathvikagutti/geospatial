[project]
name = "geospatial-measurement-api"
version = "0.1.0"
description = "FastAPI service that ingests Shapefile (.zip) and KML files, extracts features, and returns CRS-aware area/length measurements."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sathvika Gutti", email = "guttisathvika77@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.7.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*Fiona.*:UserWarning",
]
